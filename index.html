<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Prabu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="ipod" id="ipod" data-case="silver" role="application" aria-label="iPod menu. Use arrow keys to scroll, Enter to select, Escape to go back.">
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="left">
            <div class="titlebar">
              <span class="title" id="title"></span>
              <span class="status"><span class="play-ind" id="playInd"></span><span class="battery"><i></i></span></span>
            </div>
            <div class="views" id="views"></div>
          </div>
          <div class="art" id="art"></div>
        </div>
      </div>

      <div class="wheel-wrap">
        <div class="wheel" id="wheel">
          <span class="wl menu" data-btn="menu">MENU</span>
          <span class="wl prev" data-btn="prev"><svg viewBox="0 0 28 14"><rect x="0" y="1" width="2.6" height="12"/><path d="M15 1v12L3 7zM27 1v12L15 7z"/></svg></span>
          <span class="wl next" data-btn="next"><svg viewBox="0 0 28 14"><path d="M1 1v12l12-6zM13 1v12l12-6z"/><rect x="25.4" y="1" width="2.6" height="12"/></svg></span>
          <span class="wl play" data-btn="play"><svg viewBox="0 0 28 14"><path d="M1 1v12l11-6z"/><rect x="16" y="1" width="3.4" height="12"/><rect x="22.6" y="1" width="3.4" height="12"/></svg></span>
          <button class="center" id="center" data-btn="center" aria-label="Select"></button>
        </div>
      </div>
    </div>
  </main>

  <p class="hint">Drag around the wheel to scroll · center to select · MENU to go back &nbsp;—&nbsp; or ↑ ↓ ⏎ esc</p>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
